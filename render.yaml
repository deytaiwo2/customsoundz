services:
  - type: web
    name: dublu-ve-api
    runtime: node
    plan: free
    region: oregon
    branch: feature/dublu-ve-integrated-marketplace
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dublu-ve-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dublu-ve-web.onrender.com
      - key: APP_BASE_URL
        value: https://dublu-ve-web.onrender.com
      - key: API_BASE_URL
        value: https://dublu-ve-api.onrender.com
      - key: PAYMENT_MODE
        value: test
      - key: DEFAULT_CURRENCY
        value: NGN

  - type: web
    name: dublu-ve-web
    runtime: static
    branch: feature/dublu-ve-integrated-marketplace
    rootDir: .
    buildCommand: npm ci && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://dublu-ve-api.onrender.com/api/v1

databases:
  - name: dublu-ve-postgres
    databaseName: dublu_ve
    user: dublu_ve_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
