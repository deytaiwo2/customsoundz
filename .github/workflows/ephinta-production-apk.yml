name: Dublu Vé Production Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: dublu-ve-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-production-apk:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Android signing secret: $name"
              exit 1
            fi
          done

      - name: Check production API URL
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${VITE_API_URL:-}" ]]; then
            echo "::error::Set the repository variable VITE_API_URL to the production HTTPS API base ending in /api/v1."
            exit 1
          fi
          case "$VITE_API_URL" in https://*) ;; *) echo "::error::VITE_API_URL must use HTTPS."; exit 1;; esac
          [[ "$VITE_API_URL" == */api/v1 ]] || { echo "::error::VITE_API_URL must end in /api/v1."; exit 1; }
          API_ORIGIN="${VITE_API_URL%/api/v1}"
          curl -fsS --retry 6 --retry-delay 10 --max-time 60 "$API_ORIGIN/health" >/dev/null
          echo "Production API health check passed."

      - name: Install dependencies
        run: npm ci

      - name: Build web application for the production API
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build:web

      - name: Sync Capacitor Android project
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Set monotonically increasing Android version code
        working-directory: apps/mobile/android/app
        run: |
          set -euo pipefail
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          grep -n "versionCode" build.gradle

      - name: Restore and validate signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/dublu-ve-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify signature and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" release-output/dublu-ve-production.apk
          sha256sum release-output/dublu-ve-production.apk > release-output/SHA256SUMS.txt

      - name: Verify signing certificate fingerprint
        shell: bash
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')"
          if [[ -z "${EXPECTED:-}" ]]; then
            echo "::error::Set repository variable ANDROID_CERT_SHA256 to the expected signing certificate fingerprint: $ACTUAL"
            exit 1
          fi
          WANT="$(echo "$EXPECTED" | tr -d ': ' | tr 'A-Z' 'a-z')"
          [[ "$ACTUAL" == "$WANT" ]] || { echo "::error::APK signing certificate does not match ANDROID_CERT_SHA256."; exit 1; }
          echo "Release APK signing certificate matches the configured fingerprint."

      - name: Upload production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dublu-ve-production-apk
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dublu Vé ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-output/dublu-ve-production.apk
            release-output/SHA256SUMS.txt
