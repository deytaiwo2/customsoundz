services:
  - type: web
    name: dublu-ve-api-demo
    runtime: node
    plan: free
    region: oregon
    branch: feature/dublu-ve-integrated-marketplace
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dublu-ve-demo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dublu-ve-web-k070.onrender.com
      - key: APP_BASE_URL
        value: https://dublu-ve-web-k070.onrender.com
      - key: PAYMENT_MODE
        value: test
      - key: DEFAULT_CURRENCY
        value: NGN

databases:
  - name: dublu-ve-demo-postgres
    databaseName: dublu_ve_demo
    user: dublu_ve_demo_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
